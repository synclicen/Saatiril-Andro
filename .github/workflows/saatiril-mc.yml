name: Saatiril MC

# Builds the MC-only APK (no Admin, no Operator — BLE Remote only).
# This is a locked-down app that MC installs on their phone.
# MC can ONLY do: scan BLE → connect → PANGGIL/NEXT/RESET.
# No access to Admin panel, Operator camera, or license.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saatiril-mc.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mc:
    name: Build MC-Only APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Install SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mc-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: gradle-mc-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV

      - name: Create keystore.properties
        if: env.KEYSTORE_FILE != ''
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build MC Debug APK
        run: ./gradlew assembleMcDebug --no-daemon --stacktrace

      - name: Build MC Release APK
        if: env.KEYSTORE_FILE != ''
        run: ./gradlew assembleMcRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          find . -name "*.apk" -path "*/mc/debug/*" -exec cp {} saatiril-mc-debug.apk \;
          find . -name "*.apk" -path "*/mc/release/*" -exec cp {} saatiril-mc.apk \;
          ls -la saatiril-mc*.apk

      - name: Upload MC Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-mc-debug
          path: saatiril-mc-debug.apk
          if-no-files-found: warn

      - name: Upload MC Release APK
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-mc-release
          path: saatiril-mc.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseExists = $false
          try { gh release view latest 2>$null; if ($LASTEXITCODE -eq 0) { $releaseExists = $true } } catch {}
          if ($releaseExists) {
            gh release delete-asset latest saatiril-mc.apk --yes 2>$null || true
            gh release delete-asset latest saatiril-mc-debug.apk --yes 2>$null || true
            gh release upload latest saatiril-mc.apk saatiril-mc-debug.apk --clobber
          } else {
            gh release create latest saatiril-mc.apk saatiril-mc-debug.apk --title "Saatiril Andro - Latest Build" --notes "MC-Only APK (BLE Remote)" --prerelease
          }
        shell: pwsh
