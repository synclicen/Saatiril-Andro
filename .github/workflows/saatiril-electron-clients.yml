name: Saatiril Electron Clients

on:
  push:
    branches: [main]
    paths:
      - 'electron-clients/**'
      - 'src/app/page.tsx'
      - '.github/workflows/saatiril-electron-clients.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MC + Operator Electron Apps
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (includes Electron)
        run: npm install --legacy-peer-deps
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Enable Next.js static export
        shell: pwsh
        run: |
          $c = Get-Content next.config.ts -Raw
          $c = $c -replace '// output: "export",', 'output: "export",'
          Set-Content next.config.ts $c -NoNewline

      - name: Remove API route
        shell: pwsh
        run: |
          if (Test-Path "src/app/api") { Remove-Item -Recurse -Force "src/app/api" }

      - name: Build Next.js
        run: npx next build
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify static export
        shell: pwsh
        run: |
          if (Test-Path "out/index.html") { Write-Host "Static export OK" }
          else { Write-Error "out/index.html NOT found!"; exit 1 }

      - name: Bundle MC main
        run: npx esbuild electron-clients/mc-main.ts --bundle --platform=node --outfile=electron-clients/mc-main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder

      - name: Bundle Operator main
        run: npx esbuild electron-clients/operator-main.ts --bundle --platform=node --outfile=electron-clients/operator-main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder

      - name: Bundle preload
        run: npx esbuild electron-clients/preload.ts --bundle --platform=node --outfile=electron-clients/preload.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder

      - name: Build MC Electron app (from root — uses root node_modules with Electron)
        shell: pwsh
        run: |
          # Copy compiled files to root so electron-builder finds them
          Copy-Item electron-clients/mc-main.js mc-main.js -Force
          Copy-Item electron-clients/preload.js preload.js -Force
          Copy-Item electron-clients/connection.html connection.html -Force
          # Build using ROOT node_modules (has Electron installed)
          npx electron-builder --win --x64 -c.extraMetadata.main=mc-main.js --config electron-clients/builder-mc.yml
          # Clean up root copies
          Remove-Item mc-main.js, preload.js, connection.html -ErrorAction SilentlyContinue

      - name: Build Operator Electron app (from root)
        shell: pwsh
        run: |
          Copy-Item electron-clients/operator-main.js operator-main.js -Force
          Copy-Item electron-clients/preload.js preload.js -Force
          Copy-Item electron-clients/connection.html connection.html -Force
          npx electron-builder --win --x64 -c.extraMetadata.main=operator-main.js --config electron-clients/builder-operator.yml
          Remove-Item operator-main.js, preload.js, connection.html -ErrorAction SilentlyContinue

      - name: Upload to Saatiril-Andro releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          
          echo "=== Searching for MC exe ==="
          find . -name "saatiril-mc-electron.exe" -not -path "./node_modules/*" 2>/dev/null
          MC_EXE=$(find . -name "saatiril-mc-electron.exe" -not -path "./node_modules/*" 2>/dev/null | head -1)
          if [ -n "$MC_EXE" ]; then
            echo "Found MC: $MC_EXE ($(ls -lh "$MC_EXE" | awk '{print $5}'))"
            cp "$MC_EXE" saatiril-mc-electron.exe
            gh release delete-asset latest saatiril-mc-electron.exe --yes --repo "$REPO" 2>/dev/null || true
            gh release upload latest saatiril-mc-electron.exe --repo "$REPO" && echo "MC uploaded" || echo "MC upload failed"
          else
            echo "MC not found"
          fi
          
          echo "=== Searching for Operator exe ==="
          find . -name "saatiril-operator-electron.exe" -not -path "./node_modules/*" 2>/dev/null
          OP_EXE=$(find . -name "saatiril-operator-electron.exe" -not -path "./node_modules/*" 2>/dev/null | head -1)
          if [ -n "$OP_EXE" ]; then
            echo "Found Operator: $OP_EXE ($(ls -lh "$OP_EXE" | awk '{print $5}'))"
            cp "$OP_EXE" saatiril-operator-electron.exe
            gh release delete-asset latest saatiril-operator-electron.exe --yes --repo "$REPO" 2>/dev/null || true
            gh release upload latest saatiril-operator-electron.exe --repo "$REPO" && echo "Operator uploaded" || echo "Operator upload failed"
          else
            echo "Operator not found"
          fi
          
          echo "=== Done ==="
          exit 0

      - name: Build summary
        shell: bash
        run: |
          echo "=========================================="
          echo "  Saatiril Electron Clients Build Complete!"
          echo "=========================================="
          echo "  MC: saatiril-mc-electron.exe (~80MB)"
          echo "  OP: saatiril-operator-electron.exe (~80MB)"
          echo "=========================================="
