name: Saatiril Electron Clients

on:
  push:
    branches: [main]
    paths:
      - 'electron-clients/**'
      - 'src/app/page.tsx'
      - '.github/workflows/saatiril-electron-clients.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MC + Operator Electron Apps
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1

      - name: Enable Next.js static export
        shell: pwsh
        run: |
          $c = Get-Content next.config.ts -Raw
          $c = $c -replace '// output: "export",', 'output: "export",'
          Set-Content next.config.ts $c -NoNewline

      - name: Remove API route
        shell: pwsh
        run: |
          if (Test-Path "src/app/api") { Remove-Item -Recurse -Force "src/app/api" }

      - name: Build Next.js
        run: npx next build
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify static export
        shell: pwsh
        run: |
          if (Test-Path "out/index.html") { Write-Host "Static export OK" }
          else { Write-Error "out/index.html NOT found!"; exit 1 }

      - name: Compile Electron client TypeScript
        run: npx tsc -p electron-clients/tsconfig.json

      - name: Bundle MC main with esbuild
        run: npx esbuild electron-clients/mc-main.ts --bundle --platform=node --outfile=electron-clients/mc-main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder

      - name: Bundle Operator main with esbuild
        run: npx esbuild electron-clients/operator-main.ts --bundle --platform=node --outfile=electron-clients/operator-main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder

      - name: Build MC Electron app
        working-directory: electron-clients
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-mc
          Copy-Item dist/mc-main.js dist-mc/
          Copy-Item dist/preload.js dist-mc/
          Copy-Item connection.html dist-mc/
          Copy-Item package-mc.json dist-mc/package.json
          Copy-Item ../public/icon.ico dist-mc/ -ErrorAction SilentlyContinue
          Push-Location dist-mc
          npm install
          npx electron-builder --win --x64
          Pop-Location

      - name: Build Operator Electron app
        working-directory: electron-clients
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-operator
          Copy-Item dist/operator-main.js dist-operator/
          Copy-Item dist/preload.js dist-operator/
          Copy-Item connection.html dist-operator/
          Copy-Item package-operator.json dist-operator/package.json
          Copy-Item ../public/icon.ico dist-operator/ -ErrorAction SilentlyContinue
          Push-Location dist-operator
          npm install
          npx electron-builder --win --x64
          Pop-Location

      - name: Upload to Saatiril-Andro releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          
          MC_EXE=$(find electron-clients/dist-mc -name "saatiril-mc-electron.exe" 2>/dev/null | head -1)
          if [ -n "$MC_EXE" ]; then
            gh release delete-asset latest saatiril-mc-electron.exe --yes --repo "$REPO" 2>/dev/null || true
            gh release upload latest "$MC_EXE" --repo "$REPO"
            echo "MC uploaded: $MC_EXE"
          else
            echo "MC build not found"
            find electron-clients/dist-mc -name "*.exe" 2>/dev/null || echo "  no .exe"
          fi
          
          OP_EXE=$(find electron-clients/dist-operator -name "saatiril-operator-electron.exe" 2>/dev/null | head -1)
          if [ -n "$OP_EXE" ]; then
            gh release delete-asset latest saatiril-operator-electron.exe --yes --repo "$REPO" 2>/dev/null || true
            gh release upload latest "$OP_EXE" --repo "$REPO"
            echo "Operator uploaded: $OP_EXE"
          else
            echo "Operator build not found"
            find electron-clients/dist-operator -name "*.exe" 2>/dev/null || echo "  no .exe"
          fi

      - name: Build summary
        shell: bash
        run: |
          echo "=========================================="
          echo "  Saatiril Electron Clients Build Complete!"
          echo "=========================================="
          echo "  Outputs in Saatiril-Andro releases:"
          echo "  - saatiril-mc-electron.exe (MC app)"
          echo "  - saatiril-operator-electron.exe (Operator app)"
          echo "=========================================="
