name: Saatiril Win

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saatiril-win.yml'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source (Saatiril-Andro)
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Enable Next.js static export
        shell: pwsh
        run: |
          $configPath = "next.config.ts"
          $content = Get-Content $configPath -Raw
          $content = $content -replace '// output: "export",', 'output: "export",'
          Set-Content $configPath $content -NoNewline
      - name: Remove API route
        shell: pwsh
        run: |
          $apiDir = "src/app/api"
          if (Test-Path $apiDir) { Remove-Item -Recurse -Force $apiDir }
      - name: Build Next.js
        run: npx next build
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
          NEXT_TELEMETRY_DISABLED: 1
      - name: Verify static export
        shell: pwsh
        run: |
          if (Test-Path "out/index.html") {
            $fc = (Get-ChildItem "out" -Recurse -File).Count
            Write-Host "Static export OK ($fc files)"
          } else { Write-Error "out/index.html NOT found!"; exit 1 }
      - name: Verify mc.html has v11 + photoshoot UI
        shell: pwsh
        run: |
          $mc = Get-Content "out/mc.html" -Raw
          if ($mc -match 'v20-operator-rebuild') { Write-Host "mc.html v11 - OK" }
          else { Write-Error "mc.html v11 NOT found!"; exit 1 }
          if ($mc -match 'renderPhotoshoot' -and $mc -match 'KIRIM KE OPERATOR') { Write-Host "mc.html photoshoot UI - OK" }
          else { Write-Error "mc.html photoshoot UI NOT found!"; exit 1 }
          if ($mc -match 'callStatus = data.student.status') { Write-Host "mc.html MC_CALL uses data.student.status - OK" }
          else { Write-Error "mc.html MC_CALL fix NOT found!"; exit 1 }
      - name: Verify operator.html
        shell: pwsh
        run: |
          $op = Get-Content "out/operator.html" -Raw
          if ($op -match 'v20-operator-rebuild') { Write-Host "operator.html v11 - OK" }
          else { Write-Error "operator.html v11 NOT found!"; exit 1 }
      - name: Compile Electron preload
        run: npx tsc -p electron/tsconfig.json
      - name: Bundle Electron main
        run: npx esbuild electron/main.ts --bundle --platform=node --outfile=electron/main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder
      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PORTABLE=$(find dist-electron -name "*-Portable.exe" | head -1)
          cp "$PORTABLE" dist-electron/saatiril-portable.exe
          if gh release view latest --repo "$REPO" 2>/dev/null; then
            gh release delete-asset latest saatiril-portable.exe --yes --repo "$REPO" 2>/dev/null || true
            gh release upload latest dist-electron/saatiril-portable.exe --clobber --repo "$REPO"
          else
            gh release create latest dist-electron/saatiril-portable.exe --title "Saatiril Andro - Latest" --notes "Build #${{ github.run_number }}" --prerelease --repo "$REPO"
          fi
