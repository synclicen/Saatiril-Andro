name: Saatiril Win

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saatiril-win.yml'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source (Saatiril-Andro)
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Enable Next.js static export
        shell: pwsh
        run: |
          $configPath = "next.config.ts"
          $content = Get-Content $configPath -Raw
          $content = $content -replace '// output: "export",', 'output: "export",'
          Set-Content $configPath $content -NoNewline
      - name: Remove API route
        shell: pwsh
        run: |
          $apiDir = "src/app/api"
          if (Test-Path $apiDir) { Remove-Item -Recurse -Force $apiDir }
      - name: Build Next.js
        run: npx next build
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
          NEXT_TELEMETRY_DISABLED: 1
      - name: Verify static export
        shell: pwsh
        run: |
          if (Test-Path "out/index.html") {
            $fc = (Get-ChildItem "out" -Recurse -File).Count
            Write-Host "Static export OK ($fc files)"
          } else { Write-Error "out/index.html NOT found!"; exit 1 }
      - name: Verify mc.html has v11 + photoshoot UI
        shell: pwsh
        run: |
          $mc = Get-Content "out/mc.html" -Raw
          if ($mc -match 'v24-client-sync-fix') { Write-Host "mc.html v11 - OK" }
          else { Write-Error "mc.html v11 NOT found!"; exit 1 }
          if ($mc -match 'renderPhotoshoot' -and $mc -match 'KIRIM KE OPERATOR') { Write-Host "mc.html photoshoot UI - OK" }
          else { Write-Error "mc.html photoshoot UI NOT found!"; exit 1 }
          if ($mc -match 'callStatus = data.student.status') { Write-Host "mc.html MC_CALL uses data.student.status - OK" }
          else { Write-Error "mc.html MC_CALL fix NOT found!"; exit 1 }
      - name: Verify operator.html
        shell: pwsh
        run: |
          $op = Get-Content "out/operator.html" -Raw
          if ($op -match 'v24-client-sync-fix') { Write-Host "operator.html v11 - OK" }
          else { Write-Error "operator.html v11 NOT found!"; exit 1 }
      - name: Compile Electron preload
        run: npx tsc -p electron/tsconfig.json
      - name: Bundle Electron main
        run: npx esbuild electron/main.ts --bundle --platform=node --outfile=electron/main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder
      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # EOS Live View (Hot Folder) needs ffmpeg.exe next to the app: it is
      # bundled from the ffmpeg-static dev dependency (build.extraResources).
      # Fail the build when the binary is missing or has no gdigrab device,
      # instead of shipping an app whose "Live View dari EOS" button is dead.
      - name: Verify bundled FFmpeg (EOS Live View)
        shell: bash
        run: |
          set -euo pipefail
          FF="dist-electron/win-unpacked/resources/ffmpeg/ffmpeg.exe"
          if [ ! -f "$FF" ]; then
            echo "::error::ffmpeg.exe is missing from the packaged app — EOS Live View would not work."
            exit 1
          fi
          echo "Bundled ffmpeg: $(ls -lh "$FF" | awk '{print $5}')"
          echo "sha256: $(sha256sum "$FF" | awk '{print $1}')  (ffmpeg-static 5.3.0 / release b6.1.1)"
          "$FF" -hide_banner -version | head -n 1
          if "$FF" -hide_banner -devices 2>/dev/null | grep -qw gdigrab; then
            echo "gdigrab device: OK"
          else
            echo "::error::The bundled FFmpeg has no gdigrab device — EOS Live View would not work."
            exit 1
          fi
      # Informational only: tells whether this runner has a desktop gdigrab
      # can read. A failure here does not block the release.
      - name: FFmpeg gdigrab smoke test (informational)
        shell: bash
        run: |
          FF="dist-electron/win-unpacked/resources/ffmpeg/ffmpeg.exe"
          OUT="$RUNNER_TEMP/gdigrab-smoke.jpg"
          rm -f "$OUT"
          if "$FF" -hide_banner -loglevel error -f gdigrab -i desktop -frames:v 1 -f mjpeg -q:v 5 -y "$OUT" \
             && [ -s "$OUT" ]; then
            echo "gdigrab captured a frame from the runner desktop ($(stat -c %s "$OUT") bytes)."
          else
            echo "NOTE: gdigrab could not capture the runner desktop — informational only."
          fi
          rm -f "$OUT"
      # The live view window is chosen by its title (CAMERA_WINDOW_PATTERNS in
      # electron/ffmpeg-capture.ts): Imaging Edge's start page ("Imaging Edge")
      # must never be captured while its remote shooting window ("Remote")
      # shows the live view. Checked with the compiled module — the window
      # decision and the MJPEG pipeline here, against two real windows below.
      - name: Capture module tests (window selection, MJPEG pipeline)
        shell: bash
        run: node electron/tests/ffmpeg-capture.test.js electron/ffmpeg-capture.js node_modules/ffmpeg-static/ffmpeg.exe
      # Real windows "Imaging Edge" / "Remote" + the bundled ffmpeg.exe: the
      # capture must show "Remote" (green), a title picked by hand that window.
      # Informational for now: a runner without a usable desktop must not
      # block the release — the result goes into the job summary.
      - name: EOS live view with real windows (Imaging Edge / Remote)
        shell: bash
        continue-on-error: true
        run: |
          set -u
          OUT="$RUNNER_TEMP/eos-e2e"
          mkdir -p "$OUT"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File electron/tests/eos-windows.ps1 -Seconds 150 > "$OUT/windows.log" 2>&1 &
          HELPER=$!
          FF="$(cygpath -w "$PWD/dist-electron/win-unpacked/resources/ffmpeg/ffmpeg.exe")"
          node electron/tests/eos-live-view.e2e.js electron/ffmpeg-capture.js "$FF" "$OUT" > "$OUT/e2e.log" 2>&1
          CODE=$?
          kill "$HELPER" 2>/dev/null || true
          cat "$OUT/e2e.log"
          {
            echo "### EOS live view with real windows"
            if [ "$CODE" -eq 0 ]; then echo "PASS — the capture showed the window \"Remote\"."; else echo "FAILED (exit $CODE) — informational, does not block the release."; fi
            echo '```'
            cat "$OUT/e2e.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "e2e exit code: $CODE"
          exit $CODE
      - name: Upload EOS live view test frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-live-view-e2e
          path: ${{ runner.temp }}/eos-e2e
          if-no-files-found: ignore
      - name: Upload to releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          PORTABLE=$(find dist-electron -name "*-Portable.exe" | head -1)
          cp "$PORTABLE" dist-electron/saatiril-portable.exe
          ASSET_NAME="saatiril-portable.exe"

          # Robust helper: delete an existing release asset by NAME using the
          # GitHub REST API + jq. `gh release delete-asset ... 2>/dev/null || true`
          # silently swallows delete failures (pagination quirks, transient
          # errors), leaving `gh release upload --clobber` to crash with HTTP
          # 422 "ReleaseAsset.name already exists". This function fetches the
          # release JSON, resolves the asset ID by exact name match, and
          # DELETEs it directly by ID. Safe to call when the asset is absent.
          # jq is pre-installed on all GitHub Actions runners (incl. windows).
          delete_asset_by_name() {
            local name="$1"
            local rel_json asset_id code
            rel_json=$(curl -sS -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/latest")
            asset_id=$(printf '%s' "$rel_json" \
              | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' 2>/dev/null \
              | head -1)
            if [ -n "$asset_id" ]; then
              echo "  Found existing $name (asset id: $asset_id) — deleting via API"
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/releases/assets/${asset_id}")
              echo "  DELETE returned HTTP $code"
              # 204 = deleted, 404 = already gone — both fine.
              case "$code" in
                204|404) echo "  Existing $name removed (or already absent)";;
                *) echo "  WARNING: delete returned $code — will still try --clobber upload";;
              esac
            else
              echo "  No existing $name found on release — nothing to delete"
            fi
          }

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            echo "=== Release 'latest' exists — replacing $ASSET_NAME ==="
            delete_asset_by_name "$ASSET_NAME"
            # Belt-and-suspenders: --clobber lets gh retry if a same-named
            # asset reappeared between our delete and the upload.
            gh release upload latest "dist-electron/${ASSET_NAME}" --clobber --repo "$REPO"
          else
            echo "=== Release 'latest' does NOT exist — creating ==="
            gh release create latest "dist-electron/${ASSET_NAME}" \
              --title "Saatiril Andro - Latest" \
              --notes "Build #${{ github.run_number }}" \
              --prerelease --repo "$REPO"
          fi
          echo "=== Upload step finished ==="
