<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="saatiril-version" content="v24-mirror-live" />
  <title>Saatiril Mirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Mirror image — flipped by default so participants see themselves like a
       real mirror (raise right hand → hand appears on right side of screen).
       Add ?flip=0 in the URL to disable (e.g. for rear-facing camera feed). */
    #mirror-img {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
      transition: opacity 150ms ease-out;
    }
    #mirror-img.no-flip { transform: none; }
    #mirror-img.loading { opacity: 0.4; }

    /* Frame overlay — sits ON TOP of the camera img. The frame is the
       project's design element (text + logo for the final photo). It's
       NOT flipped (even when the camera is flipped) so the text remains
       readable. The frame is sent ONCE via MIRROR_CONFIG (not per-frame)
       → no per-frame CPU cost. Hidden by default until MIRROR_CONFIG
       arrives with frameData. */
    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms ease-out;
      z-index: 3;
    }
    #frame-overlay.show { opacity: 1; }

    /* Big countdown overlay (gold, pulsing) — fades in/out per second. */
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      font-size: 35vmin;
      font-weight: 900;
      color: #d4af37;
      text-shadow:
        0 0 30px rgba(212, 175, 55, 0.7),
        0 0 60px rgba(212, 175, 55, 0.5),
        0 0 100px rgba(212, 175, 55, 0.3);
      font-family: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
      letter-spacing: -0.05em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 250ms ease-out, transform 250ms ease-out;
    }
    #countdown.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    /* White flash overlay — emitted when operator captures the photo. */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease-out;
      z-index: 10;
    }
    #flash.flash {
      opacity: 1;
      transition: none;
    }

    /* Connection status badge (top-left, dim). */
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #c4b5fd;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      background: rgba(26, 11, 46, 0.7);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(83, 52, 133, 0.5);
      pointer-events: none;
      z-index: 5;
    }
    #status.connected { color: #4ade80; border-color: rgba(74, 222, 128, 0.5); }
    #status.disconnected { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
    #status.hidden { display: none; }

    /* Hint banner — auto-hide after 5s. */
    #hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #c4b5fd;
      font-size: 12px;
      background: rgba(26, 11, 46, 0.7);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(83, 52, 133, 0.5);
      pointer-events: none;
      transition: opacity 600ms ease-out;
      z-index: 5;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <img id="mirror-img" alt="Live Camera Mirror" class="loading" />
  <img id="frame-overlay" alt="" />
  <div id="countdown"></div>
  <div id="flash"></div>
  <div id="status">Connecting…</div>
  <div id="hint">Klik untuk fullscreen · F fullscreen · M flip mirror</div>

  <script src="/js/socket.io.min.js"></script>
  <script>
    (function() {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var channel = parseInt(params.get('channel') || '1', 10) || 1;
      var flip = params.get('flip') !== '0'; // default: flipped (mirror)
      var ip = params.get('ip') || window.location.hostname;
      // socketPort — read from URL (?socketPort=N) for flexibility; default 3003
      // (matches the Saatiril Electron + Android server default).
      var SOCKET_PORT = parseInt(params.get('socketPort') || '3003', 10) || 3003;

      var img = document.getElementById('mirror-img');
      var frameOverlay = document.getElementById('frame-overlay');
      var countdown = document.getElementById('countdown');
      var flash = document.getElementById('flash');
      var status = document.getElementById('status');
      var hint = document.getElementById('hint');

      if (!flip) img.classList.add('no-flip');

      // Auto-hide the hint after 5s
      setTimeout(function() { hint.classList.add('hidden'); }, 5000);

      // Connect to the Saatiril socket.io server. Mirrors the operator.html
      // connection pattern — CRITICAL: the server uses path: '/' (NOT the
      // socket.io default '/socket.io/'). Without this option, the polling
      // request 404s and the mirror page shows a permanent black screen.
      var isCaddyGateway = window.location.port === '81';
      var explicitSocketPort = params.get('socketPort');
      var serverUrl, socketOptions;
      var commonOpts = {
        path: '/',
        transports: ['websocket', 'polling'],
        upgrade: true,
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 500,
        reconnectionDelayMax: 5000,
        timeout: 10000,
      };
      if (explicitSocketPort) {
        // Direct to socket.io port (operator's URL includes ?socketPort=N).
        serverUrl = 'http://' + ip + ':' + explicitSocketPort;
        socketOptions = Object.assign({}, commonOpts);
      } else if (isCaddyGateway) {
        // Via Caddy gateway on port 81 — use XTransformPort query so Caddy
        // routes the request to the socket.io server port (3003).
        serverUrl = window.location.origin;
        socketOptions = Object.assign({}, commonOpts, {
          query: { XTransformPort: String(SOCKET_PORT) },
        });
      } else {
        // Fallback: direct to default socket.io port.
        serverUrl = 'http://' + ip + ':' + SOCKET_PORT;
        socketOptions = Object.assign({}, commonOpts);
      }

      console.log('[MIRROR] connecting to', serverUrl, 'channel=' + channel, 'flip=' + flip);

      var socket = io(serverUrl, socketOptions);

      function setStatus(text, cls) {
        status.textContent = text;
        status.className = cls || '';
      }

      socket.on('connect', function() {
        console.log('[MIRROR] socket connected:', socket.id, '→ server:', serverUrl);
        setStatus('● ch' + channel + (flip ? ' · mirror' : ' · no-flip'), 'connected');
        socket.emit('identify', { role: 'mirror', channel: channel });
        // Ask the operator for a current frame so the mirror isn't black until
        // the next interval tick.
        socket.emit('lan-message', { event: 'MIRROR_REQUEST', data: { channel: channel } });
      });

      socket.on('disconnect', function() {
        console.log('[MIRROR] socket disconnected');
        setStatus('● Disconnected · reconnecting…', 'disconnected');
      });

      socket.on('connect_error', function(err) {
        console.warn('[MIRROR] connect_error:', err.message || err);
        setStatus('● Conn error: ' + (err.message || 'unknown'), 'disconnected');
      });

      // Frame counter + last-frame timestamp for diagnostics. If no frame
      // arrives within ~3s, the status flips to "menunggu frame…".
      var frameCount = 0;
      var lastFrameAt = 0;
      var lastFrameCheck = setInterval(function() {
        if (frameCount > 0 && Date.now() - lastFrameAt > 3000) {
          // Frames were arriving but stopped — operator likely toggled OFF
          // or camera went inactive. Show a "no signal" hint.
          setStatus('● ch' + channel + ' · menunggu frame…', 'disconnected');
        }
      }, 1500);

      socket.on('lan-message', function(payload) {
        if (!payload || !payload.event) return;
        var data = payload.data || {};
        // Only handle events for OUR channel (or 'all' — for shared broadcasts).
        if (data.channel && data.channel !== channel && data.channel !== 'all' && data.channel !== 0) return;

        if (payload.event === 'MIRROR_FRAME') {
          if (data.frame) {
            // Operator sends a base64 data URL string (toBlob + FileReader
            // async on operator side — no main-thread block there). We just
            // set img.src directly — the browser handles the base64 decode
            // + JPEG decode + render async. Tried sending binary Blob
            // through socket.io v4 but it caused black-screen regression
            // on the mirror side (the Blob wasn't reconstructed correctly
            // in some setups) — reverted to the proven string path that
            // worked at commit 1df4732.
            //
            // If frame is a Blob (somehow), convert to object URL + revoke
            // the previous one to prevent memory leak. Otherwise treat as
            // string (data URL).
            var newSrc;
            if (typeof data.frame === 'string') {
              newSrc = data.frame;
            } else if (data.frame instanceof Blob) {
              newSrc = URL.createObjectURL(data.frame);
            } else if (data.frame && typeof data.frame.size === 'number' && data.frame.size > 0) {
              // Buffer-like / unknown binary — try wrapping in a Blob.
              try {
                newSrc = URL.createObjectURL(new Blob([data.frame], { type: 'image/jpeg' }));
              } catch (e) {
                newSrc = null;
              }
            }
            if (newSrc) {
              // Revoke any previous blob: URL to prevent memory leak.
              if (img._lastBlobUrl && img._lastBlobUrl.indexOf('blob:') === 0) {
                try { URL.revokeObjectURL(img._lastBlobUrl); } catch (e) {}
              }
              img.src = newSrc;
              img._lastBlobUrl = (newSrc.indexOf('blob:') === 0) ? newSrc : null;
              img.classList.remove('loading');
              frameCount++;
              lastFrameAt = Date.now();
              // After first frame, hide the status badge entirely (no need to
              // see "connected" once we're actively rendering).
              if (frameCount === 1) {
                status.classList.add('hidden');
                // Diagnostic: log the type of the first frame so we can
                // verify what's actually arriving. Helps debug future
                // black-screen regressions.
                var frameType = typeof data.frame;
                var ctor = data.frame && data.frame.constructor ? data.frame.constructor.name : 'n/a';
                var sz = (typeof data.frame === 'string')
                  ? data.frame.length
                  : (data.frame.size || data.frame.byteLength || 0);
                console.log('[MIRROR] first frame type=' + frameType + ' ctor=' + ctor + ' size=' + sz + 'B');
              }
            }
          }
          return;
        }

        // MIRROR_CONFIG — sent ONCE when the operator's cssFilter or
        // frameData changes (or in response to our MIRROR_REQUEST on
        // connect). Applies the project's CSS filter (e.g. grayscale
        // for B&W) + frame overlay to the mirror view via CSS
        // (GPU-accelerated, no per-frame CPU cost). The MIRROR_FRAME
        // wire payload stays minimal — just the raw JPEG.
        if (payload.event === 'MIRROR_CONFIG') {
          // Apply the CSS filter (e.g. 'grayscale(1)', 'sepia(0.5)') to
          // the camera img. The browser's GPU applies it for every
          // rendered frame at NO CPU cost. 'none' = no filter.
          if (typeof data.cssFilter === 'string' && data.cssFilter !== 'none') {
            img.style.filter = data.cssFilter;
            console.log('[MIRROR] applied cssFilter:', data.cssFilter);
          } else {
            img.style.filter = '';
          }
          // Apply the frame overlay (base64 data URL of the project's
          // frame image). Set src + show; or hide if no frame.
          if (typeof data.frameData === 'string' && data.frameData.length > 0) {
            frameOverlay.src = data.frameData;
            frameOverlay.classList.add('show');
            console.log('[MIRROR] applied frame overlay, size=', Math.round(data.frameData.length / 1024) + 'KB');
          } else {
            frameOverlay.classList.remove('show');
            frameOverlay.removeAttribute('src');
          }
          return;
        }

        // Log non-frame events for debugging (countdown / capture / clear).
        console.log('[MIRROR] event:', payload.event, 'data:', data);

        switch (payload.event) {
          case 'MIRROR_COUNTDOWN':
            var secs = data.seconds;
            if (typeof secs !== 'number') break;
            if (secs <= 0) {
              countdown.classList.remove('show');
              setTimeout(function() { countdown.textContent = ''; }, 300);
            } else {
              countdown.textContent = String(secs);
              // Force reflow so the .show transition restarts (pulse per second).
              void countdown.offsetWidth;
              countdown.classList.add('show');
              // Hide slightly before the next tick to make the pulse visible.
              setTimeout(function() { countdown.classList.remove('show'); }, 700);
            }
            break;

          case 'MIRROR_CAPTURE':
            // White flash overlay (matches operator's flash duration).
            flash.classList.add('flash');
            setTimeout(function() { flash.classList.remove('flash'); }, 90);
            break;

          case 'MIRROR_CLEAR':
            // Revoke any pending blob URL before clearing src.
            if (img._lastBlobUrl) {
              try { URL.revokeObjectURL(img._lastBlobUrl); } catch (e) {}
              img._lastBlobUrl = null;
            }
            img.classList.add('loading');
            img.removeAttribute('src');
            countdown.classList.remove('show');
            setTimeout(function() { countdown.textContent = ''; }, 300);
            break;
        }
      });

      // ── Cleanup blob URL on page unload (prevent memory leak) ─────────────
      window.addEventListener('beforeunload', function() {
        if (img._lastBlobUrl) {
          try { URL.revokeObjectURL(img._lastBlobUrl); } catch (e) {}
          img._lastBlobUrl = null;
        }
        if (socket) socket.disconnect();
      });

      // ── Fullscreen toggle (click anywhere) ──────────────────────────────────
      document.addEventListener('click', function() {
        if (!document.fullscreenElement) {
          var req = document.documentElement.requestFullscreen ||
                     document.documentElement.webkitRequestFullscreen;
          if (req) req.call(document.documentElement);
        }
      });

      // ── Keyboard shortcuts ──────────────────────────────────────────────────
      document.addEventListener('keydown', function(e) {
        if (e.key === 'f' || e.key === 'F') {
          if (!document.fullscreenElement) {
            var req = document.documentElement.requestFullscreen ||
                       document.documentElement.webkitRequestFullscreen;
            if (req) req.call(document.documentElement);
          } else {
            var exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document);
          }
        } else if (e.key === 'm' || e.key === 'M') {
          img.classList.toggle('no-flip');
          flip = !img.classList.contains('no-flip');
          setStatus('● ch' + channel + (flip ? ' · mirror' : ' · no-flip'), 'connected');
        } else if (e.key === 'Escape') {
          if (document.fullscreenElement) {
            var ex = document.exitFullscreen || document.webkitExitFullscreen;
            if (ex) ex.call(document);
          }
        }
      });
    })();
  </script>
</body>
</html>
