<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saatiril - Connect</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a0b2e; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { width:100%; max-width:360px; padding:24px; }
.logo { text-align:center; margin-bottom:24px; }
.logo h1 { font-size:28px; font-weight:800; letter-spacing:3px; color:#d4af37; }
.logo p { font-size:10px; color:#c4b5fd; margin-top:4px; }
.role-badge { display:inline-block; padding:4px 12px; border-radius:6px; font-size:10px; font-weight:700; margin-top:8px; }
.role-badge.mc { background:rgba(212,175,55,0.2); color:#d4af37; border:1px solid #d4af37; }
.role-badge.op { background:rgba(6,182,212,0.2); color:#06b6d4; border:1px solid #06b6d4; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:11px; color:#c4b5fd; margin-bottom:4px; font-weight:600; }
.field input, .field select { width:100%; padding:10px; border-radius:8px; border:1px solid #533485; background:#2a164a; color:#fff; font-size:14px; outline:none; }
.field input:focus, .field select:focus { border-color:#d4af37; }
.connect-btn { width:100%; height:48px; border:none; border-radius:10px; background:#d4af37; color:#1a0b2e; font-size:15px; font-weight:800; cursor:pointer; margin-top:8px; }
.connect-btn:hover { background:#c5a030; }
.connect-btn:disabled { background:#533485; color:#c4b5fd; cursor:not-allowed; }
.error { color:#ef4444; font-size:11px; text-align:center; margin-top:8px; display:none; }
.hint { font-size:10px; color:#533485; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>SAATIRIL</h1>
    <p>Sistem Auto Track Input, Raw Into Live</p>
    <div id="roleBadge" class="role-badge mc">MC</div>
  </div>
  <div class="field">
    <label>IP Address Admin</label>
    <input id="hostInput" type="text" placeholder="192.168.100.61" value="">
  </div>
  <div class="field">
    <label>Password Sesi (opsional)</label>
    <input id="pwInput" type="password" placeholder="Kosongkan jika tidak ada">
  </div>
  <div class="field">
    <label>Channel</label>
    <select id="chSelect">
      <option value="1">Channel 1</option>
      <option value="2">Channel 2</option>
    </select>
  </div>
  <button id="connectBtn" class="connect-btn" onclick="doConnect()">CONNECT</button>
  <div id="errMsg" class="error"></div>
  <div class="hint">Pastikan admin sudah berjalan dan WiFi terhubung</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const role = params.get('role') || 'mc';
document.getElementById('roleBadge').textContent = role === 'mc' ? 'MC' : 'OPERATOR';
document.getElementById('roleBadge').className = 'role-badge ' + (role === 'mc' ? 'mc' : 'op');
document.title = role === 'mc' ? 'Saatiril MC - Connect' : 'Saatiril Operator - Connect';

// Check for command line args (auto-connect)
if (window.saatirilAPI && window.saatirilAPI.getConnectionInfo) {
  window.saatirilAPI.getConnectionInfo().then(function(info) {
    if (info && info.host) {
      document.getElementById('hostInput').value = info.host;
      if (info.channel) document.getElementById('chSelect').value = info.channel;
      if (info.password) document.getElementById('pwInput').value = info.password;
      doConnect();
    }
  });
}

function doConnect() {
  const host = document.getElementById('hostInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  const ch = document.getElementById('chSelect').value;
  if (!host) { showErr('Masukkan IP address admin'); return; }
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.textContent = 'MENGHUBUNGKAN...';
  const url = 'http://' + host + ':3000/?role=' + role + '&channel=' + ch + '&socketPort=3003&password=' + encodeURIComponent(pw) + '&v=23';
  if (window.saatirilAPI && window.saatirilAPI.connectToServer) {
    window.saatirilAPI.connectToServer(url);
  } else {
    location.href = url;
  }
}
function showErr(msg) {
  const e = document.getElementById('errMsg');
  e.textContent = msg;
  e.style.display = 'block';
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('connectBtn').textContent = 'CONNECT';
}
</script>
</body>
</html>
